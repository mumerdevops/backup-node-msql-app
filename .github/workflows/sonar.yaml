name: SonarQube Analysis

on:
  push:
    branches: [ "main" ]

jobs:
  sonarqube:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This replaces the "uses: sonarsource/sonarqube-scan-action" step
      - name: Install and Run SonarScanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # 1. Download the scanner
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -o sonar-scanner.zip
          
          # 2. Run the scanner using the downloaded binary
          ./sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner \
            -Dsonar.projectKey=node-mysql-app \
            -Dsonar.projectName=node-mysql-app \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Download Report from API
        run: |
          # Wait a few seconds for the background task to process on the server
          sleep 5
          curl -sS -L -u "${{ secrets.SONAR_TOKEN }}:" \
          "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?projectKey=node-mysql-app" \
          -o sonar-report.json

      - name: Save Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-analysis-report
          path: sonar-report.json
